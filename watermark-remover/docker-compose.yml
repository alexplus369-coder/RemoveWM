version: "3.9"

# Uso:
#   CPU (default):  docker compose up
#   GPU (NVIDIA):   docker compose --profile gpu up

services:
  backend-cpu:
    build: ./backend
    profiles: ["cpu", "default"]
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - model_cache:/root/.cache/iopaint   # modelos descargados en caché
    environment:
      - CUDA_VISIBLE_DEVICES=""            # fuerza CPU
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-gpu:
    build: ./backend
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - model_cache:/root/.cache/iopaint
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend-cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  model_cache:    # persiste los pesos del modelo LaMa entre reinicios
